    <meta property="og:description" content="Painel de controle e gestão de frota, serviços, despesas e relatórios de logística." />
    <script>
      // Protection against conflicting web3 wallet browser extensions attempting to redefine window.ethereum
      (function() {
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if ((target === window || target === window.window) && prop === 'ethereum') {
              try {
                return originalDefineProperty.call(this, target, prop, {
                  ...descriptor,
                  configurable: true,
                  writable: true,
                });
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return target;
              }
            }
            return originalDefineProperty.apply(this, arguments);
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            event &&
            (event.message?.includes('ethereum') ||
              event.error?.message?.includes('ethereum') ||
              (typeof event.message === 'string' && event.message.includes('Cannot redefine property')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            (event.reason.message?.includes('ethereum') ||
              (typeof event.reason.message === 'string' && event.reason.message.includes('Cannot redefine property')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
